<style>
/* Layout: barra fija con logos, portada corta, filtros pegajosos y cuadrícula de tarjetas; carrito y pedido como pantallas aparte. Tema oscuro único (marca Speed). */
:root {
  --bg: #0e0f11; --panel: #16181b; --well: #101215; --line: #22252a; --line2: #2c2f35;
  --fg: #f2f3f5; --muted: #9aa0a8; --dim: #6b7078; --soft: #c7ccd4;
  --accent: #e11b22; --accent-hi: #ff2a31; --ok: #1d7a43;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea { font-family: inherit; }
input::placeholder, textarea::placeholder { color: var(--dim); }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .22em; color: var(--accent); text-transform: uppercase; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--dim); text-transform: uppercase; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(14,15,17,.95); backdrop-filter: blur(10px); border-bottom: 1px solid #24262b; }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 12px; }
.top img.speed { height: 64px; width: auto; }
.top img.ltj { height: 58px; width: auto; }
.top .sep { width: 1px; height: 44px; background: var(--line2); }
.top .grow { flex: 1; }
.btn { border-radius: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; padding: 10px 15px; border: 1px solid var(--line2); background: none; color: var(--soft); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { border-color: #45484f; color: #fff; }
.btn.red { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.red:hover { background: var(--accent-hi); }
.btn .count { background: rgba(0,0,0,.35); border-radius: 20px; min-width: 24px; padding: 2px 7px; font-family: var(--mono); font-size: 12px; }

.hero { padding-block: 40px 26px; border-bottom: 1px solid #1c1e22; }
.hero-row { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; margin-top: 12px; }
.hero h1 { font-family: var(--display); font-size: clamp(38px, 7vw, 64px); line-height: .95; font-weight: 700; margin: 0; text-transform: uppercase; text-wrap: balance; }
.hero .mr { height: 130px; width: auto; max-width: 100%; margin-left: auto; }
.hero p { max-width: 620px; margin: 14px 0 0; font-size: 16px; line-height: 1.55; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 22px; font-family: var(--mono); font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
.stats b { color: var(--fg); font-weight: 500; }
.stock-badge { display: inline-flex; align-items: center; gap: 8px; color: var(--soft); }
.stock-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #2fbf6b; }

.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 89px); z-index: 10; background: rgba(14,15,17,.95); backdrop-filter: blur(10px); display: flex; gap: 8px; flex-wrap: wrap; padding-block: 18px 8px; }
.chip { background: none; border: 1px solid var(--line2); color: var(--soft); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.need { border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; padding-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card:hover { border-color: #34383f; }
.photo { position: relative; height: 220px; background: var(--well); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.photo .visor { width: 62%; height: 34%; border-radius: 999px 999px 40% 40% / 999px 999px 60% 60%; box-shadow: 0 6px 20px rgba(0,0,0,.35); border: 1px solid rgba(0,0,0,.25); }
.ref { position: absolute; left: 10px; top: 10px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--fg); background: rgba(0,0,0,.6); padding: 3px 7px; border-radius: 5px; }
.body { padding: 14px 15px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.ttl { font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1.05; text-transform: uppercase; }
.price { font-family: var(--mono); font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.det { margin-top: 5px; font-size: 13px; color: var(--muted); line-height: 1.35; }
.sizes { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.sizes .row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.size { padding: 7px 12px; }
.chip.size[disabled] { opacity: .6; cursor: default; }
.actions { display: flex; gap: 8px; }
.step { display: flex; align-items: center; border: 1px solid var(--line2); border-radius: 9px; overflow: hidden; }
.step button { background: none; border: none; color: var(--soft); width: 34px; height: 38px; font-size: 18px; cursor: pointer; padding: 0; }
.step button:hover { background: var(--line); color: #fff; }
.step span { font-family: var(--mono); font-size: 13px; min-width: 22px; text-align: center; }
.add { flex: 1; background: var(--line); border: 1px solid var(--line2); color: #fff; border-radius: 9px; font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; height: 38px; }
.add:hover { border-color: #45484f; }
.add.done { background: var(--ok); border-color: var(--ok); }

.page-head { padding-block: 38px 22px; }
.page-head h1 { font-family: var(--display); font-size: clamp(38px, 7vw, 52px); line-height: 1; font-weight: 700; margin: 10px 0 0; text-transform: uppercase; }
.page-head p { margin: 12px 0 0; color: var(--muted); font-size: 15px; max-width: 560px; line-height: 1.55; }
.empty { border: 1px dashed var(--line2); border-radius: 14px; padding: 50px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 16px; }
.lines { display: flex; flex-direction: column; gap: 11px; }
.line { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; display: flex; flex-direction: column; gap: 10px; }
.line-top { display: flex; gap: 12px; align-items: flex-start; }
.sw { width: 56px; height: 56px; border-radius: 10px; flex: 0 0 auto; border: 1px solid var(--line2); background: var(--well) center/contain no-repeat; }
.line-info { flex: 1; min-width: 0; }
.line-info .ttl { font-size: 18px; }
.line-info .det { margin-top: 3px; font-size: 12px; }
.line-info .sum { margin-top: 5px; font-family: var(--mono); font-size: 11px; color: var(--soft); }
.x { background: none; border: 1px solid var(--line2); color: #8b9099; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 13px; flex: 0 0 auto; }
.x:hover { border-color: var(--accent); color: var(--accent); }
.line-bot { display: flex; gap: 9px; align-items: center; }
.line-bot .step button { width: 30px; height: 32px; font-size: 16px; }
.field { width: 100%; min-width: 0; background: var(--well); border: 1px solid var(--line2); border-radius: 9px; color: var(--fg); padding: 11px 12px; font-size: 14px; }
.line-bot .field { padding: 8px 10px; font-size: 12px; border-radius: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 18px; align-items: start; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.vend { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--well); border: 1px solid var(--line2); color: var(--fg); border-radius: 9px; padding: 11px 13px; cursor: pointer; text-align: left; font-size: 14px; font-weight: 600; }
.vend.on { background: var(--line); border-color: var(--accent); }
.vend span { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 400; }
.fixed-v { display: flex; align-items: center; gap: 11px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 16px; }
.total { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.send { width: 100%; padding: 15px; border-radius: 10px; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: center; text-decoration: none; display: block; background: var(--line); color: var(--dim); pointer-events: none; }
.send.ready { background: var(--accent); color: #fff; pointer-events: auto; }
.send.ready:hover { background: var(--accent-hi); }
.note { font-size: 12px; color: var(--dim); line-height: 1.5; }
.summary-bar { margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 18px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
.links { margin-top: 34px; border-top: 1px solid #1c1e22; padding-top: 20px; }
.linkbtn { background: none; border: none; color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; padding: 0; }
.linkbtn:hover { color: var(--soft); }
.link-grid { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.link-card { background: var(--well); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.link-card .u { font-family: var(--mono); font-size: 11px; color: var(--dim); word-break: break-all; line-height: 1.5; user-select: all; }
.small-btn { align-self: flex-start; background: none; border: 1px solid var(--line2); color: var(--soft); padding: 7px 12px; border-radius: 7px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.small-btn:hover { border-color: var(--accent); color: #fff; }
.foot { margin-top: 40px; padding-block: 20px 30px; border-top: 1px solid #1c1e22; color: var(--dim); font-size: 12px; }

@media (max-width: 700px) {
  .top .wrap { gap: 10px; padding-block: 10px; }
  .top img.speed { height: 36px; } .top img.ltj { height: 34px; } .top .sep { height: 30px; }
  .top .btn { padding: 8px 10px; font-size: 11px; }
  .top .btn.cat { display: none; }
  .hero { padding-block: 20px 16px; }
  .hero .mr { height: 74px; }
  .hero p { font-size: 14px; }
  .filters { top: calc(env(safe-area-inset-top, 0px) + 57px); flex-wrap: nowrap; overflow-x: auto; padding-block: 10px 8px; }
  .chip { flex: 0 0 auto; white-space: nowrap; padding: 7px 11px; font-size: 11px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .photo { height: 120px; }
  .body { padding: 9px 9px 10px; gap: 8px; }
  .title-row { flex-direction: column; gap: 2px; }
  .ttl { font-size: 15px; } .price { font-size: 13px; } .det { font-size: 11px; margin-top: 2px; }
  .sizes .label { display: none; }
  .chip.size { padding: 6px 9px; }
  .step button { width: 26px; height: 34px; font-size: 15px; }
  .add { height: 34px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<script>

const SHARE_URL = location.origin + location.pathname;
const VISORES = ["BLUE", "GOLD", "SMOKE", "SILVER", "RED", "RAINBOW"];
const COLOR = {

  CATALOGO.push({ id: "C" + (i + 1), tipo: "casco", ref: "SP-0" + n, foto: "assets/cascos/" + n + ".webp",
    casco: p[0], visor: p[1], spoiler: p[2], tallas: p[3].split(","),
    titulo: "Casco " + p[0], detalle: "Visor " + p[1] + " · Spoiler " + p[2], precio: 1300 });
});
CASCOS2.forEach((r, i) => {
  if (!r[3]) return;
  CATALOGO.push({ id: "M" + (i + 1), tipo: "casco", casco: r[0], visor: "", spoiler: "",
    ref: (r[0] === "CROSS" ? "CR-" : "MD-") + String(i + 1).padStart(3, "0"),
    foto: "assets/cascos2/" + String(r[4]).padStart(2, "0") + ".webp",
    titulo: r[1], detalle: r[2], tallas: r[3], precio: r[5], corto: r[6] });
});
VISORES.forEach((v, i) => {
  CATALOGO.push({ id: "V" + (i + 1), tipo: "visor", ref: "VS-" + String(i + 1).padStart(3, "0"), foto: "",
    casco: "VISORES", visor: v, spoiler: "", tallas: [], titulo: "Visor " + v, detalle: "Repuesto · visor suelto", precio: 150 });
});
const LLANTAS = [["L1", "100/90-17", "TL", "T-158", 1050, "assets/llantas/L1.svg"], ["L2", "2.75-18", "TT", "T-114", 670, "assets/llantas/L2.svg"], ["L3", "3.00-17", "TT", "T-115", 670, "assets/llantas/L3.svg"], ["L4", "3.00-18", "TT", "T-114", 690, "assets/llantas/L4.svg"], ["L5", "3.00-18", "TT", "T-515", 690, "assets/llantas/L5.svg"], ["L6", "4.10-18", "TT", "T-175", 875, "assets/llantas/L6.svg"], ["L7", "4.10-18", "TT", "T-515", 900, "assets/llantas/L7.svg"], ["L8", "90/90-19", "TT", "T-012", 760, "assets/llantas/L8.svg"]];
LLANTAS.forEach((r) => {
  CATALOGO.push({ id: r[0], tipo: "llanta", ref: "LL-00" + r[0].slice(1), foto: r[5], casco: "LLANTAS", visor: "", spoiler: "", tallas: [], medida: r[1],
    titulo: "Llanta " + r[1], detalle: (r[2] === "TL" ? "Sin tubo (TL)" : "Con tubo (TT)") + " · Diseño " + r[3], precio: r[4], corto: "LLANTA " + r[1] + " " + r[2] + " " + r[3] });
});
const GRUPOS = ["TODOS"].concat(CATALOGO.map((c) => c.casco).filter((c, i, a) => a.indexOf(c) === i));
const byId = (id) => CATALOGO.find((c) => c.id === id);
const minCasco = Math.min(...CATALOGO.filter((c) => c.tipo === "casco").map((c) => c.precio));

const KEY = "speed-cascos-pedido-v2";
const S = { screen: "catalogo", grupo: "TODOS", sel: {}, cant: {}, carrito: [], negocio: "", contacto: "", telefono: "", rtn: "", direccion: "", vendedor: "", fijo: null, links: false, added: "" };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved) Object.assign(S, saved);
} catch (e) {}
S.carrito = (S.carrito || []).filter((l) => { const it = byId(l.id); return it && (!it.tallas.length || it.tallas.includes(l.talla)); });
const fromHash = (location.hash || "").replace("#", "").toLowerCase();
S.fijo = VENDEDORES.find((v) => v.id === fromHash) || null;
if (S.fijo) S.vendedor = S.fijo.id;

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ carrito: S.carrito, negocio: S.negocio, contacto: S.contacto, telefono: S.telefono, rtn: S.rtn, direccion: S.direccion, vendedor: S.vendedor })); } catch (e) {}
}
const vendedor = () => S.fijo || VENDEDORES.find((v) => v.id === S.vendedor) || null;
const lineas = () => S.carrito.map((l) => { const it = byId(l.id); return Object.assign({}, l, { it, sub: it.precio * l.cant }); });
const tallaDe = (it) => S.sel[it.id] || (it.tallas.length === 1 ? it.tallas[0] : "");
const cantDe = (it) => S.cant[it.id] || 1;

function mensaje() {
  const ls = lineas(), v = vendedor();
  const total = ls.reduce((a, l) => a + l.sub, 0), uds = ls.reduce((a, l) => a + l.cant, 0);
  const W = { d: 30, c: 4, u: 10, t: 11 }, ANCHO = W.d + W.c + W.u + W.t;
  const der = (s, w) => String(s).padStart(w, " ");
  const izq = (s, w) => (s.length > w ? s.slice(0, w - 1) + "." : s.padEnd(w, " "));
  const out = ["PEDIDO — INVERSIONES Y DISTRIBUCIONES SPEED", "Vendedor: " + (v ? titleCase(v.nombre) : "-"),
    "Empresa: " + (S.negocio || "-"), "Cliente: " + (S.contacto || "-"), "Teléfono: " + (S.telefono || "-")];
  if (S.rtn) out.push("RTN: " + S.rtn);
  if (S.direccion) out.push("Ciudad / envío: " + S.direccion);
  out.push("", "```", izq("DESCRIPCION", W.d) + der("CANT", W.c) + der("UNITARIO", W.u) + der("TOTAL", W.t), "-".repeat(ANCHO));
  ls.forEach((l) => {
    out.push(izq(descCorta(l.it, l.talla), W.d) + der(l.cant, W.c) + der(l.it.precio.toFixed(2), W.u) + der(l.sub.toFixed(2), W.t));
    if (l.note) out.push("  * " + l.note.slice(0, 100));
  });
  out.push("-".repeat(ANCHO), izq("TOTAL DEL PEDIDO (L.)", W.d + W.c) + der(total.toFixed(2), W.u + W.t), "```", "", uds + " unidades / " + ls.length + " productos");
  return out.join("\n");
}

const app = document.getElementById("app");
function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }
document.getElementById("goCat").onclick = () => go("catalogo");
document.getElementById("goCart").onclick = () => go("carrito");

function stepHtml(minus, val, plus) {
  return '<div class="step"><button type="button" aria-label="Menos" data-act="' + minus + '">−</button><span>' + val + '</span><button type="button" aria-label="Más" data-act="' + plus + '">+</button></div>';
}

function viewCatalogo() {
  const items = CATALOGO.filter((it) => S.grupo === "TODOS" || it.casco === S.grupo);
  const cards = items.map((it) => {
    const t = tallaDe(it), pend = S.sel[it.id] === "?";
    const foto = it.foto ? '<img src="' + it.foto + '" alt="' + esc(it.titulo + " " + it.detalle) + '" loading="lazy">'
      : '<div class="visor" style="background:' + fill(it.visor) + '"></div>';
    const sizes = (it.tallas.length ? it.tallas : [it.medida || "ÚNICA"]).map((s) =>
      '<button type="button" class="chip size' + (t === s ? " on" : "") + (pend ? " need" : "") + '"' + (it.tallas.length ? ' data-act="size:' + it.id + ':' + s + '"' : " disabled") + ">" + s + "</button>").join("");
    return '<article class="card"><div class="photo">' + foto + '<div class="ref">' + it.ref + '</div></div><div class="body">' +
      '<div><div class="title-row"><div class="ttl">' + esc(it.titulo) + '</div><div class="price">' + money(it.precio) + '</div></div><div class="det">' + esc(it.detalle) + "</div></div>" +
      '<div class="sizes"><div class="label">' + (it.tallas.length ? (pend ? "Elegí una talla" : "Tallas disponibles") : it.medida ? "Medida" : "Talla única") + '</div><div class="row">' + sizes + "</div></div>" +
      '<div class="actions">' + stepHtml("qty:" + it.id + ":-1", cantDe(it), "qty:" + it.id + ":1") +
      '<button type="button" class="add' + (S.added === it.id ? " done" : "") + '" data-act="add:' + it.id + '">' + (S.added === it.id ? "✓ Agregado" : "Agregar") + "</button></div></div></article>";
  }).join("");
  return '<div class="wrap"><section class="hero"><div class="eyebrow">Catálogo mayorista · 2026</div><div class="hero-row"><h1>Cascos, visores y llantas</h1><img class="mr" src="assets/logo-mr.webp" alt="M&amp;R Inversiones"></div>' +
    "<p>Elegí talla y cantidad de cada modelo, agregá notas si necesitás algo específico y enviá tu pedido directo por WhatsApp a tu vendedor.</p>" +
    '<div class="stats"><div><b>' + CATALOGO.length + "</b> modelos</div><div>Cascos desde <b>" + money(minCasco) + "</b></div><div>Visores <b>" + money(150) + '</b></div><div class="stock-badge">Existencias al ' + INVENTARIO_FECHA + "</div></div></section>" +
    '<nav class="filters" aria-label="Filtrar por línea">' + GRUPOS.map((g) => '<button type="button" class="chip' + (S.grupo === g ? " on" : "") + '" data-act="grp:' + g + '">' + (g === "TODOS" ? "Todos" : g) + "</button>").join("") + "</nav>" +
    '<div class="grid">' + cards + "</div></div>";
}

function lineHtml(l, compact) {
  const bg = l.it.foto ? "url(" + l.it.foto + ")" : fill(l.it.casco === "VISORES" ? l.it.visor : l.it.casco);
  const resumen = (l.talla ? "Talla " + l.talla : l.it.medida ? "Medida " + l.it.medida : "Talla única") + " · x" + l.cant + " · " + money(l.sub);
  return '<div class="line"><div class="line-top"><div class="sw" style="background-image:' + (l.it.foto ? bg : "none") + ";" + (l.it.foto ? "" : "background:" + bg) + '"></div>' +
    '<div class="line-info"><div class="ttl">' + esc(l.it.titulo) + '</div><div class="det">' + esc(l.it.detalle) + '</div><div class="sum">' + resumen + "</div></div>" +
    '<button type="button" class="x" aria-label="Quitar" data-act="del:' + l.key + '">✕</button></div>' +
    '<div class="line-bot">' + stepHtml("chg:" + l.key + ":-1", l.cant, "chg:" + l.key + ":1") +
    '<input class="field" id="nota-' + l.key + '" data-note="' + l.key + '" maxlength="100" placeholder="Nota para este producto (opcional)" value="' + esc(l.note) + '"></div></div>';
}

function viewCarrito() {
  const ls = lineas(), uds = ls.reduce((a, l) => a + l.cant, 0), total = ls.reduce((a, l) => a + l.sub, 0);
  let h = '<div class="wrap" style="max-width:900px"><div class="page-head"><div class="eyebrow">Paso 1 de 2</div><h1>Tu carrito</h1></div>';
  if (!ls.length) return h + '<div class="empty"><div>Todavía no agregaste productos.</div><button type="button" class="btn red" data-act="go:catalogo">Ver catálogo</button></div></div>';
  h += '<div class="lines">' + ls.map((l) => lineHtml(l)).join("") + "</div>";
  h += '<div class="summary-bar"><div><div class="label">' + ls.length + " productos · " + uds + ' unidades</div><div class="total">' + money(total) + "</div></div>" +
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" data-act="go:catalogo">Seguir agregando</button><button type="button" class="btn red" data-act="go:pedido">Finalizar pedido</button></div></div></div>';
  return h;
}

function waHref() { const v = vendedor(); return v ? "https://wa.me/" + v.wa + "?text=" + encodeURIComponent(mensaje()) : "#"; }
function completo() { return !!(vendedor() && S.negocio && S.contacto && S.telefono && S.carrito.length); }

function viewPedido() {
  const ls = lineas(), uds = ls.reduce((a, l) => a + l.cant, 0), total = ls.reduce((a, l) => a + l.sub, 0), v = vendedor();
  const fld = (id, ph, type) => '<input class="field" id="f-' + id + '" data-field="' + id + '" ' + (type ? 'type="' + type + '" ' : "") + 'placeholder="' + ph + '" value="' + esc(S[id]) + '">';
  const vbox = S.fijo
    ? '<div class="fixed-v"><div class="avatar">' + v.nombre.split(" ").map((w) => w[0]).join("") + '</div><div><div style="font-weight:600">' + v.nombre + '</div><div class="mono" style="font-size:12px;color:var(--muted)">' + v.tel + "</div></div></div>"
    : VENDEDORES.map((vd) => '<button type="button" class="vend' + (S.vendedor === vd.id ? " on" : "") + '" data-act="vend:' + vd.id + '">' + vd.nombre + "<span>" + vd.tel + "</span></button>").join("");
  const links = S.links ? '<div class="link-grid">' + VENDEDORES.map((vd) => {
    const url = SHARE_URL + "#" + vd.id;
    return '<div class="link-card"><div style="font-weight:600;font-size:14px">' + vd.nombre + '</div><div class="u">' + url + '</div><button type="button" class="small-btn" data-act="copy:' + vd.id + '">Copiar link</button></div>';
  }).join("") + "</div>" : "";
  return '<div class="wrap" style="max-width:980px"><div class="page-head"><div class="eyebrow">Paso 2 de 2</div><h1>Confirmar pedido</h1><p>Revisá tu lista, ajustá cantidades o notas y completá los datos del negocio. El pedido se envía por WhatsApp a tu vendedor.</p></div>' +
    '<div class="cols"><div class="lines"><div class="label">Productos del pedido</div>' +
    (ls.length ? ls.map((l) => lineHtml(l)).join("") : '<div class="empty">Tu carrito está vacío.</div>') +
    '<button type="button" class="btn" style="border-style:dashed" data-act="go:catalogo">+ Agregar más productos</button></div>' +
    '<div class="lines"><div class="box"><div class="label">Datos del negocio</div>' + fld("negocio", "Nombre del negocio *") + fld("contacto", "Nombre de quien pide *") + fld("telefono", "Teléfono *", "tel") + fld("rtn", "RTN (opcional)") + fld("direccion", "Ciudad / dirección de entrega") + "</div>" +
    '<div class="box"><div class="label">' + (S.fijo ? "Tu vendedor asignado" : "Elegí tu vendedor") + "</div>" + vbox + "</div>" +
    '<div class="box"><div class="label" id="resumen">' + ls.length + " productos · " + uds + ' unidades</div><div class="total">' + money(total) + "</div>" +
    '<a id="send" class="send" target="_blank" rel="noopener" href="#">Enviar pedido por WhatsApp</a>' +
    '<button type="button" class="small-btn" data-act="copymsg">Copiar texto del pedido</button>' +
    '<div class="note" id="aviso"></div></div></div></div>' +
    '<div class="links"><button type="button" class="linkbtn" data-act="links">' + (S.links ? "— Ocultar links por vendedor" : "+ Links directos por vendedor (uso interno)") + "</button>" + links + "</div></div>";
}

function refreshSend() {
  const a = document.getElementById("send"); if (!a) return;
  const ok = completo(), v = vendedor();
  a.classList.toggle("ready", ok);
  a.href = ok ? waHref() : "#";
  a.textContent = ok ? "Enviar pedido por WhatsApp" : "Completá los datos para enviar";
  a.setAttribute("aria-disabled", ok ? "false" : "true");
  document.getElementById("aviso").textContent = v
    ? "Se abrirá WhatsApp con el pedido listo para " + titleCase(v.nombre) + " (" + v.tel + "). Si no abre, usá «Copiar texto del pedido» y pegalo en WhatsApp."
    : "Elegí un vendedor para poder enviar el pedido.";
}

function render() {
  const uds = S.carrito.reduce((a, l) => a + l.cant, 0);
  document.getElementById("cartCount").textContent = uds;
  app.innerHTML = (S.screen === "carrito" ? viewCarrito() : S.screen === "pedido" ? viewPedido() : viewCatalogo()) +
    '<footer class="foot"><div class="wrap">Inversiones y Distribuciones Speed · Precios mayoristas en lempiras · Existencias al ' + INVENTARIO_FECHA + "</div></footer>";
  refreshSend();
}

function copyText(txt, btn, label) {
  const done = () => { btn.textContent = "Copiado ✓"; setTimeout(() => { btn.textContent = label; }, 1500); };
  try {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallback());
  } catch (e) { fallback(); }
  function fallback() {
    const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); done(); } catch (e) {} t.remove();
  }
}

app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const [cmd, a, b] = el.getAttribute("data-act").split(":");
  if (cmd === "go") return go(a);
  if (cmd === "grp") { S.grupo = a; return render(); }
  if (cmd === "size") { S.sel[a] = b; return render(); }
  if (cmd === "qty") { const it = byId(a); S.cant[a] = Math.max(1, cantDe(it) + Number(b)); return render(); }
  if (cmd === "add") {
    const it = byId(a), t = tallaDe(it);
    if (it.tallas.length && !t) { S.sel[a] = "?"; return render(); }
    const key = it.id + "-" + (t || "U");
    const f = S.carrito.find((l) => l.key === key);
    if (f) f.cant += cantDe(it); else S.carrito.push({ key, id: it.id, talla: t || "", cant: cantDe(it), note: "" });
    S.added = it.id; save(); render();
    setTimeout(() => { if (S.added === it.id) { S.added = ""; if (S.screen === "catalogo") render(); } }, 1400);
    return;
  }
  if (cmd === "chg") { S.carrito.forEach((l) => { if (l.key === a) l.cant += Number(b); }); S.carrito = S.carrito.filter((l) => l.cant > 0); save(); return render(); }
  if (cmd === "del") { S.carrito = S.carrito.filter((l) => l.key !== a); save(); return render(); }
  if (cmd === "vend") { S.vendedor = a; save(); return render(); }
  if (cmd === "links") { S.links = !S.links; return render(); }
  if (cmd === "copy") return copyText(SHARE_URL + "#" + a, el, "Copiar link");
  if (cmd === "copymsg") return copyText(mensaje(), el, "Copiar texto del pedido");
});
app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.field) { S[t.dataset.field] = t.value; save(); refreshSend(); }
  if (t.dataset.note) { const l = S.carrito.find((x) => x.key === t.dataset.note); if (l) { l.note = t.value.slice(0, 100); save(); refreshSend(); } }
});
window.addEventListener("hashchange", () => {
  const h = location.hash.replace("#", "").toLowerCase();
  const v = VENDEDORES.find((x) => x.id === h);
  if (v) { S.fijo = v; S.vendedor = v.id; save(); render(); }
});
render();
</script>
